services:
  traefik_base:
    image: traefik:v3.6.0
    ports:
      - ${TRAEFIK_PORT:-18080}:80
    command:
      - "--configFile=/etc/traefik/config-static.yaml"
    volumes:
      - ./:/etc/traefik:ro
      - ./build:/plugins-local/src/github.com/onodai145/coraza-http-wasm-traefik:ro

  traefik:
    extends: traefik_base
    depends_on:
      - httpbin

  httpbin:
    image: mccutchen/go-httpbin:v2.9.0
    environment:
      - APP_NAME=httpbin
      - MAX_BODY_SIZE=15728640 # 15 MiB
    command: [ "/bin/go-httpbin", "-port", "8000" ]
    ports:
      - ${HTTPBIN_PORT:-18000}:8000
