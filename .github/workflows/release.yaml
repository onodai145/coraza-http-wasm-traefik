name: Package reviewed local plugin
on:
  workflow_dispatch:
    inputs:
      wasm_version:
        description: Reviewed WASM release tag
        required: true
      wasm_sha256:
        description: Reviewed WASM SHA256
        required: true
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - run: go run mage.go e2eLocal
        env:
          VERSION: ${{ inputs.wasm_version }}
          WASM_SHA256: ${{ inputs.wasm_sha256 }}
      - run: docker compose -p coraza-crs up -d traefik
      - run: python3 scripts/smoke.py
      - if: always()
        run: docker compose -p coraza-crs down
      - run: cp LICENSE build/LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: coraza-local-plugin
          include-hidden-files: true
          path: |
            build/.traefik.yml
            build/coraza-http-wasm.wasm
            build/SOURCE
            build/SHA256SUMS
            build/LICENSE
