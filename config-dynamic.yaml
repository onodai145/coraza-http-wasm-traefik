http:
  routers:
    httpbin:
      rule: PathPrefix(`/`)
      service: httpbin
      entryPoints:
        - web
      middlewares:
        - request-size-limit
        - waf

  services:
    httpbin:
      loadBalancer:
        servers:
          - url: http://httpbin:8000

  middlewares:
    # Example for this service only: 13 MiB. Set an appropriate limit per route.
    # This must run before the WAF, including in DetectionOnly mode.
    request-size-limit:
      buffering:
        maxRequestBodyBytes: 13631488
        memRequestBodyBytes: 1048576
    waf:
      plugin:
        coraza:
          directives:
            - Include @coraza.conf-recommended
            # WASM cannot spill inspected bodies to disk: keep both limits equal.
            - SecRequestBodyLimit 13107200
            - SecRequestBodyInMemoryLimit 13107200
            - SecRuleEngine On
            - SecAuditEngine Off
            - Include @crs-setup.conf.example
            - Include @owasp_crs/**.conf
